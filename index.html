    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;
            });
            document.addEventListener("DOMContentLoaded", function () {
        const observerOptions = {
            threshold: 0.2 // เมื่อการ์ดโผล่เข้ามาในหน้าจอ 20% ให้เริ่มเล่นอนิเมชัน
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    // ทำการหน่วงเวลา (Delay) ให้สินค้าแสดงทีละชิ้นไล่เลี่ยกัน
                    setTimeout(() => {
                        entry.target.classList.add("show");
                    }, index * 150); // เพิ่มทีละ 0.15 วินาที
                    
                    observer.unobserve(entry.target); // ให้เล่นอนิเมชันแค่รอบเดียว
                }
            });
        }, observerOptions);

        // ดักจับการ์ดสินค้าทุกใบที่มี class product-card-scroll
        const cards = document.querySelectorAll(".product-card-scroll");
        cards.forEach(card => observer.observe(card));
    });
    </script>
